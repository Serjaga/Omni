[workspace]
resolver = "2"
members = [
    "core",
    "cors",
    "security",
    "dns",
    "tunnel",
    "db",
    "ikev2",
    "ssl",
    "miraj",
    "vpn",
    "server",
]

[workspace.package]
name = "OmniRS v8"
version = "0.8.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
# ─── internal crates ────────────────────────────────────────────
omni-core     = { path = "core" }
omni-cors     = { path = "cors" }
omni-security = { path = "security" }
omni-dns      = { path = "dns" }
omni-tunnel   = { path = "tunnel" }
omni-db       = { path = "db" }
omni-ikev2    = { path = "ikev2" }
omni-ssl      = { path = "ssl" }
omni-miraj    = { path = "miraj" }
omni-vpn      = { path = "vpn" }

# ─── general ────────────────────────────────────────────────────
anyhow = "1"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_regex = "1.2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "v4"] }
parking_lot = "0.12"
arc-swap = "1"
async-channel = "2"
either = "1"
ahash = "0.8"
derive_more = { version = "2.1", features = ["display", "error"] }
scopeguard = "1"
pin-project = "1"
crc32fast = "1"
blake2 = "0.10"
regex = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "8.2"
url = { version = "2", features = ["serde"] }
urlencoding = "2"
bytes = "1"
subtle = "2.5"
rand = "0.8"

# ─── async runtime ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }
futures-util = "0.3"

# ─── HTTP / Web ─────────────────────────────────────────────────
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "timeout", "cors", "trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
mime_guess = "2"
httparse = "1"
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }

# ─── HTTP/3 / QUIC ──────────────────────────────────────────────
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
h3-axum = "0.3"
quinn-proto = "0.11"
web-transport-quinn = "0.13.6"
web-transport-proto = "0.2.8"

# ─── TLS & Certificates ─────────────────────────────────────────
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p521 = { version = "0.14", features = ["ecdh", "getrandom"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = "0.7"
x509-parser = "0.16"
rcgen = "0.13"

# ─── IKEv2 / Crypto ─────────────────────────────────────────────
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
num-bigint = "0.4"
num-traits = "0.2"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = "0.10"
hmac = "0.12"

# ─── Database / Cache ───────────────────────────────────────────
rusqlite = { version = "0.42", features = ["bundled"] }
bb8 = "0.9"
moka = { version = "0.12", features = ["future"] }

# ─── Networking / Proxy / DNS ───────────────────────────────────
fastcgi-client = { version = "0.12", features = ["tokio"] }
fast-socks5 = "1.0"
ppp = "2.3"
ipnet = "2"
socket2 = { version = "0.6", features = ["all"] }
hickory-resolver = "0.26"
hickory-proto = "0.26"

# ─── System ─────────────────────────────────────────────────────
libc = "0.2"
nix = { version = "0.31", features = ["fs", "user", "socket", "net", "uio"] }
jsonwebtoken = "9"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
